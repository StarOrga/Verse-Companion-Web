project_id = "sc-companion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4200"
# Both web URLs + loopback range for the desktop tool OAuth callback (46800-46899).
# config.toml only affects the LOCAL supabase stack; production redirect_urls must
# be edited via the Supabase dashboard (Auth → URL Configuration) and stay in
# sync with this list. See .claude/deep-knowledge/deployment-status.md § Vercel.
# The `?**` wildcard variants tolerate query strings on the OAuth callback —
# without them Supabase rejects /uploader/auth?cb=...&state=... as "Invalid
# redirect URL" (https://supabase.com/docs/guides/auth/redirect-urls).
# Belt-and-suspenders: login.component also stashes cb+state in sessionStorage
# so the round-trip survives even if the dashboard list lags behind this file.
#
# NEVER list a host we do not control, and never a `*.vercel.app` wildcard: a
# redirect URL is where Supabase delivers the sign-in code, so whoever owns the
# host can take over the session of anyone who follows a crafted sign-in link.
# The two retired hosts (sc-companion, star-citizen-companion-website) became
# free project names on Vercel when they were removed on 2026-11-08 and were
# dropped from this list and from production on 2026-11-15, together with the
# `https://*.vercel.app/**` entry production carried. Preview deployments
# therefore return an OAuth sign-in to the production site; use password
# sign-in there. See .claude/deep-knowledge/supabase.md § Sign-up gate.
additional_redirect_urls = [
  "http://localhost:4200/news",
  "http://localhost:4200/uploader/auth",
  "http://localhost:4200/uploader/auth?**",
  "https://versecompanion-alpha.vercel.app/news",
  "https://versecompanion-alpha.vercel.app/uploader/auth",
  "https://versecompanion-alpha.vercel.app/uploader/auth?**"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

# Sign-up gate (migration 20261115233000): no account is created unless the
# e-mail is on public.allowed_emails. Like the redirect list, this block only
# configures the LOCAL stack; production has the same hook enabled in its auth
# config (hook_before_user_created_enabled / _uri). To sign up a local user,
# insert the address into public.allowed_emails first.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "250MiB"

[functions.fetch-verse-news]
# JWT verification OFF since #131 (public news): the feed aggregates only
# public sources (Comm-Link wiki API, YouTube RSS, Spectrum, status page) and
# must be reachable for signed-out visitors. The client's publishable key is
# `sb_publishable_*` (not a JWT), so the gateway gate would reject anonymous
# calls outright. No user data flows through this function.
verify_jwt = false

[functions.rsi-upcoming-ships]
# JWT verification OFF (same rationale as fetch-verse-news): a public read-only
# catalog diffing the public RSI ship-matrix against our datamined game data.
# Reachable by signed-out visitors; the client sends its `sb_publishable_*` key
# (not a JWT), so the platform gate would reject anonymous calls. No user data
# flows through this function (it reads codex_ships via the service role only).
verify_jwt = false

[functions.rsi-roadmap]
# JWT verification OFF (same rationale as fetch-verse-news): a public read-only
# proxy for the RSI roadmap Release View and the patch-note bodies RSI publishes
# in its Spectrum patch-notes forum. Both feed the public /news/patches board,
# which signed-out visitors can open; the client sends its `sb_publishable_*`
# key (not a JWT), so the platform gate would reject anonymous calls outright.
# No user data flows through this function — it only reads/writes the public
# rsi_patch_cache table via the service role.
verify_jwt = false

[functions.uex-proxy]
# JWT verification OFF (same rationale as fetch-verse-news): a public read-only
# proxy to the UEX Corp API for the Codex "Where to buy" feature (#254).
# Reachable by signed-out visitors; the client sends its `sb_publishable_*` key
# (not a JWT). The UEX bearer token lives only as the UEX_API_TOKEN edge secret
# and never reaches the browser. No user data flows through this function.
verify_jwt = false

[functions.commodity-prices]
# JWT verification OFF: public read-only commodity prices (UEX community data) for
# HQ Planen (#902). Same UEX_API_TOKEN edge secret as uex-proxy; no user data.
verify_jwt = false

[functions.process-p4k]
verify_jwt = true

[functions.ingest-catalog]
# JWT verification OFF — same rationale as ingest-bundle below. The function
# does its own auth (seed-token OR collaborator-JWT + release-token, see
# index.ts). With JWT verification ON, the platform gate rejects BOTH the
# desktop tool's asymmetric session token AND the non-JWT seed token *before*
# the function runs, breaking every codex catalog + keybinds upload. This block
# is REQUIRED, not cosmetic: `supabase functions deploy` (incl. the deploy-all
# `npm run functions:deploy`) defaults verify_jwt to TRUE when a function has no
# block, silently re-enabling the gate. Absent this block the function stayed
# working only because prior deploys passed `--no-verify-jwt` by hand. Don't
# revert without reworking the auth logic in index.ts.
verify_jwt = false

[functions.ingest-bundle]
# JWT verification OFF — the function does its own auth (getUser + admin/
# collaborator role gate + release-token, see index.ts). With JWT verification
# ON, the platform gate rejects the desktop tool's user-session token as
# "Invalid JWT" *before* the function runs: the gateway verifies against the
# legacy JWT secret, but live session tokens are signed with the project's
# asymmetric signing keys, so the gateway can't validate them (static anon-key
# calls like fetch-verse-news still pass). getUser() validates against the Auth
# server's current keys, so disabling the gate loses no security. Don't revert
# without reworking the auth logic in the function body.
verify_jwt = false

[functions.handoff-redeem]
# JWT verification OFF — the phone has no session yet; the one-time code in the
# body is the credential (hashed, 60 s, single use, see index.ts). Don't revert:
# the platform gate would reject every call before the function runs.
verify_jwt = false

[functions.desktop-latest]
# JWT verification OFF — the function does its own auth (release-token from the
# Tool, OR JWT+role for Web UI). With JWT verification ON, the release-token
# branch can never reach the function (the platform gate rejects it). Don't
# revert this without also reworking the auth logic in the function body.
verify_jwt = false

[functions.scc-release-meta]
# JWT verification OFF — public read-only proxy for the SCC App alias release
# (version + size), called anonymously by the Apps menu. No secrets in the response.
verify_jwt = false

[functions.api]
# JWT verification OFF — the /v1 API uses our own Bearer tokens (`scc_live_*`)
# OR session JWT (validated inside the tokens-mgmt handlers). /openapi.json
# and /docs are intentionally public. Platform-level JWT gate would reject
# every Bearer-token request before our middleware sees it.
verify_jwt = false

[functions.patch-stability-sample]
# JWT verification OFF (same rationale as fetch-verse-news): the daily sampler
# behind the patch board's stability indicator only mirrors public data
# (Spectrum comment counts, the RSI status page, CIG's Known Issues article)
# into two anon-readable tables via the service role. It is triggered by
# pg_cron/pg_net without a JWT. The plain daily path (no query params) is
# self-throttled (skips when the newest sample is < 6 h old) and writes only
# public data, so an unauthenticated call cannot cause upstream load. The
# operator paths `?backfill=1` and `?force=1` bypass that throttle, so
# index.ts requires an `Authorization: Bearer <service-role key>` header for
# both — the platform-level JWT gate is off, but the function does its own
# check.
verify_jwt = false

[functions.starscape-summary]
# JWT verification OFF — public, unauthenticated PNG endpoint consumed by the
# Starscape desktop wallpaper app (no login/session at boot time). Renders a
# branded weekly Verse News summary image; no user data flows through it.
verify_jwt = false

[functions.ingest-telemetry]
# JWT verification OFF — the desktop app is an unauthenticated machine client.
# The function does its own HMAC auth (X-SCC-Signature over timestamp+rawBody
# with the TELEMETRY_HMAC_KEY secret) + replay window + per-IP rate limit.
verify_jwt = false

[functions.readme-sync]
# JWT verification ON — admin-only. READ-ONLY health check for the ReadMe
# (readme.io) site; it does NOT publish. The project is Git-backed, so ReadMe
# rejects content-API writes (403 API_ACCESS_UNAVAILABLE) — docs are published
# by ReadMe Git Sync from docs/readme-io/pages/ (see GIT-SYNC-SETUP.md). The
# function reports whether the API is still closed and what the repo expects to
# be live, using README_IO_API_KEY. The handler additionally requires
# is_admin() (approved, not suspended) or the exact service key (constant-time compare, no unverified role claim).
verify_jwt = true

[functions.ship-link]
# JWT verification ON — every action is tied to a real signed-in user. The
# function stores user-supplied RSI pledge links behind a strict server-side
# allowlist (see index.ts / _rsi-url.ts) and writes exclusively through the
# CALLER'S own client, so owner-only RLS applies on top. Promotion of a link to
# a globally visible entry additionally requires profiles.role = 'admin'.
# Callers are web sessions only (same as invite-user/delete-user), so the
# platform gate is the right first line of defence here.
verify_jwt = true

[functions.concept-page]
# JWT verification OFF — the function does its own auth. The concept document
# is loaded by an <iframe src> (no headers can be attached to a navigation),
# and the page's bridge sub-requests carry an HMAC ticket in the query string
# that only `POST /ticket` (admin session, checked in index.ts) can mint.
# With the platform gate ON the iframe could never load. Don't revert without
# reworking the auth model in the function body.
verify_jwt = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.sc-events-sync]
# JWT verification OFF: pg_cron (sc-events-sync job, 20261016120000_sc_events.sql)
# calls it with the publishable key, like patch-stability-sample. The function
# only reads public Comm-Links and writes through a service_role-only RPC; it
# self-throttles to one run per hour (atomic claim_run), so the public URL cannot be abused to
# hammer the upstream API.
verify_jwt = false

[functions.codex-patch-summary]
# Service-role only: ingest-catalog `finalize` calls it with the service key
# (own check in index.ts), so the platform JWT gate must stay off.
verify_jwt = false

[functions.rsi-paints-sync]
# Service-role only crawler (own check in index.ts); no user JWT involved.
verify_jwt = false

[functions.translate-orchestrator]
# JWT verification OFF — the function does its own auth (index.ts): service-role key for
# every op, the project's anon key for `tick` only (pg_cron has no vault for the service
# key), or an admin user JWT (rpc is_admin) for approve/cancel/estimate/start_full. `sync_sources` with the
# public key is throttled to one run per 6 h (atomic claim_run).
# The gateway cannot verify the asymmetric session tokens, and `supabase functions deploy`
# defaults verify_jwt to TRUE when a function has no block. Don't revert.
verify_jwt = false

[functions.translation-overlay]
# JWT verification OFF — getUser() in index.ts rejects anything but a signed-in user (401).
# Same reason as ingest-bundle: the gateway cannot verify asymmetric session tokens.
verify_jwt = false

[functions.patch-teaser]
# JWT verification OFF: pg_cron (patch-teaser-sweep) calls it with the publishable key, so `{ sweep: true }` is open to
# any caller by design - it only fills MISSING patch_teasers rows, cannot pick a version or force, and is bounded by
# atomic claim_run claims (one Spectrum lookup per 5 min, one model call per version per 6 h). A targeted
# `{ version, slug }` call needs the service-role key (own Bearer check in index.ts).
verify_jwt = false

[functions.sc-event-sheet]
# JWT verification OFF: pg_cron (sc-event-sheet job, 20261108190200_sc_event_sheet_cron.sql) calls it with the
# publishable key, like sc-events-sync. The automatic mode is throttled (one run per 10 min, atomic claim_run) and capped (3 LLM calls);
# a targeted re-extract ({eventId}) checks the caller itself (service-role key or signed-in admin). The sheet is only
# written through the service_role/admin RPC sc_event_sheet_apply.
verify_jwt = false

[functions.posthog-signal]
# JWT verification OFF: the PostHog alert webhook cannot send a Supabase JWT and pg_cron has only the publishable key.
# Webhook mode authenticates by header x-signal-secret (POSTHOG_SIGNAL_SECRET, constant-time compare, 401 otherwise);
# the cron modes only read PostHog and write capped board items, throttled via guard_runs.
verify_jwt = false

[functions.service-health]
# JWT verification OFF: pg_cron (service-health job, 20261115030100_posthog_guard.sql) calls it with the publishable key.
# Token-free probes only, throttled via guard_runs; x-signal-secret bypasses the throttle for manual runs.
verify_jwt = false

[functions.telemetry-overview]
# JWT verification OFF for the same reason as ingest-catalog (the platform gate rejects asymmetric session tokens):
# the function itself resolves the caller with auth.getUser() and requires public.is_admin() (403 otherwise).
verify_jwt = false
